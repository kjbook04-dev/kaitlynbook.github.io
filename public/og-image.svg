<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3E7E4"/>
      <stop offset="0.55" stop-color="#E8D7D3"/>
      <stop offset="1" stop-color="#EEDDDD"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(925 170) rotate(129) scale(430 300)">
      <stop stop-color="#C98B95" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#C98B95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="creamGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 520) rotate(14) scale(560 260)">
      <stop stop-color="#F8EEEB" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#F8EEEB" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#8D5D66" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#roseGlow)"/>
  <rect width="1200" height="630" fill="url(#creamGlow)"/>
  <rect width="1200" height="630" filter="url(#grain)"/>

  <g filter="url(#softShadow)">
    <rect x="70" y="88" width="1060" height="451" rx="32" fill="#FCF6F4" fill-opacity="0.78"/>
    <rect x="70" y="88" width="1060" height="451" rx="32" stroke="#D9B8BE" stroke-opacity="0.5"/>
  </g>

  <circle cx="164" cy="164" r="46" fill="#C98B95"/>
  <text x="164" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-style="italic" fill="#FFF7F5">K</text>

  <text x="240" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#2E2A28">Kaitlyn Book</text>
  <text x="240" y="206" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B5E5B">Executive Operations &amp; Workflow Systems</text>

  <text x="106" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="600" fill="#2E2A28">
    Personal Website
  </text>
  <text x="106" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4A4341">
    Designing scalable operations, executive workflows, and digital systems
  </text>
  <text x="106" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#4A4341">
    that bring clarity, efficiency, and measurable business impact
  </text>

  <rect x="106" y="442" width="406" height="54" rx="27" fill="#C98B95"/>
  <text x="309" y="476" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFF7F5">https://kaitlynbook.com/</text>
</svg>
